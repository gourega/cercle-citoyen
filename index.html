
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CERCLE CITOYEN | Penser. Relier. Agir.</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="canonical" href="https://cerclecitoyen.ci">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://nfsskgcpqbccnwacsplc.supabase.co/storage/v1/object/public/assets/logo-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: { cercle: { blue: '#2563eb' } }
          }
        }
      }
    </script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; margin: 0; }
      #critical-error {
        display: none;
        position: fixed;
        inset: 0;
        background: white;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
      // Détection d'échec de chargement des modules
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
          const errDiv = document.getElementById('critical-error');
          if (errDiv) errDiv.style.display = 'flex';
        }
      }, true);

      window.process = { env: { NODE_ENV: 'production' } };
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <div id="critical-error">
        <div class="loader"></div>
        <h2 style="font-family: serif; font-size: 24px; font-weight: bold; margin-bottom: 1rem;">Liaison DNS en cours...</h2>
        <p style="color: #64748b; max-width: 400px; line-height: 1.6; margin-bottom: 2rem;">
            Le domaine <b>cerclecitoyen.ci</b> est en cours de propagation. Votre navigateur ne trouve pas encore la nouvelle adresse. 
            <br><br>
            <i>Conseil : Essayez de désactiver le Wi-Fi sur votre téléphone pour tester en 4G.</i>
        </p>
        <button onclick="location.reload(true)" style="background: #2563eb; color: white; border: none; padding: 1rem 2rem; border-radius: 1rem; cursor: pointer; font-weight: bold;">
            Forcer le rafraîchissement
        </button>
    </div>

    <script type="module" src="index.tsx"></script>
</body>
</html>
