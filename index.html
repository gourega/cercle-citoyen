<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE V4 - SOUVERAINETÉ</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ASSASSIN DE STYLE : On tue le vert par principe */
      body { background-color: #0a0c10 !important; margin: 0; color: white; }
      #root { min-height: 100vh; background-color: #0a0c10; }
      
      /* On masque tout ce qui ressemble à l'ancienne version par précaution */
      #liaison-banner, .green-banner, [class*="green-600"], [class*="emerald-600"] { 
        display: none !important; 
        opacity: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
      async function nukeZombie() {
        console.log("Protocole de Nettoyage V4...");

        // 1. Désenregistrement immédiat des SW
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for(let reg of regs) {
            await reg.unregister();
            console.log("Ancien SW démantelé.");
          }
        }

        // 2. Vidage des caches API
        if ('caches' in window) {
          const keys = await caches.keys();
          for(let key of keys) await caches.delete(key);
        }

        // 3. Traque du bandeau vert dans le DOM (si le HTML est déjà pollué)
        const killList = ["LIAISON SOUVERAINE", "Liaison Souveraine"];
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        let node;
        while(node = walker.nextNode()) {
          if (killList.some(text => node.textContent.includes(text))) {
            const parent = node.parentElement;
            if (parent) {
               parent.style.display = 'none';
               console.log("Élément zombie détecté et neutralisé.");
            }
          }
        }

        // 4. Chargement de l'App avec versioning temporel
        import("./index.tsx?v=" + Date.now());
      }

      nukeZombie();
    </script>
</body>
</html>
