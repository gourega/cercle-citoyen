<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE V4 - SYSTÈME SOUVERAIN</title>
    
    <!-- Anti-cache strict pour les navigateurs -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Style critique pour masquer les éléments de l'ancienne version */
      body { background-color: #0a0c10 !important; margin: 0; color: white; font-family: sans-serif; }
      #root { min-height: 100vh; background-color: #0a0c10; }
      /* On force la disparition du bandeau vert par son ID ou sa classe */
      #liaison-banner, .green-banner, .bg-green-600 { display: none !important; visibility: hidden !important; }
      
      /* Indicateur de version pour le débogage visuel */
      #version-tag {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 8px;
        color: rgba(255,255,255,0.2);
        z-index: 9999;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="version-tag">CERCLE-V4-SOUVERAINETÉ-ACTIVE</div>

    <script type="module">
      // PROTOCOLE DE PURGE ABSOLUE
      async function forceUpdate() {
        console.log("Démarrage de la Purge Système V4...");
        
        // 1. Suppression de TOUS les Service Workers enregistrés
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
            console.log("Service Worker démantelé.");
          }
        }

        // 2. Vidage de TOUS les caches du navigateur
        if ('caches' in window) {
          const cacheKeys = await caches.keys();
          for (const key of cacheKeys) {
            await caches.delete(key);
            console.log("Cache vidé : " + key);
          }
        }

        // 3. Nettoyage du stockage local pour forcer la reconnexion V4
        localStorage.removeItem('cercle_user');
        localStorage.removeItem('cercle_v4_reset');
        
        // 4. Chargement de l'application avec un paramètre unique pour briser le cache réseau
        const timestamp = Date.now();
        import("./index.tsx?v=" + timestamp);
      }

      forceUpdate().catch(console.error);
    </script>
</body>
</html>
