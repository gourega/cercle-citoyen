<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CERCLE CITOYEN | Souveraineté Numérique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // SCRIPT DE SURVIE - NETTOYAGE FORCE
        const APP_VERSION = '4.4.0';
        
        if (localStorage.getItem('cercle_v') !== APP_VERSION) {
            localStorage.clear();
            sessionStorage.clear();
            localStorage.setItem('cercle_v', APP_VERSION);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    for(let r of regs) r.unregister();
                });
            }
        }

        function forceClean() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.reload(true);
        }
    </script>

    <style>
        :root { --bg: #020617; --primary: #3b82f6; }
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; /* Empêche la recherche Google au toucher */
        }
        input, textarea { user-select: text; } /* Autorise la saisie dans les champs */

        body { 
            background-color: var(--bg); 
            margin: 0; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            touch-action: manipulation;
        }

        #splash-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999;
        }

        .loader-ring {
            width: 40px; height: 40px; border: 2px solid rgba(59, 130, 246, 0.1);
            border-top: 2px solid var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #emergency-trigger {
            position: fixed; bottom: 30px; left: 0; right: 0; text-align: center;
            z-index: 1000;
        }

        .btn-reset {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #475569;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <div id="splash-screen">
        <div class="loader-ring"></div>
        <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: #475569;">CERCLE CITOYEN</p>
    </div>

    <div id="emergency-trigger">
        <button class="btn-reset" onclick="forceClean()">Réinitialiser l'application</button>
    </div>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
