<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN | Souveraineté Numérique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // DESACTIVATION AGRESSIVE DES SERVICE WORKERS
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        // FORCE RESET SI VERSION OBSOLETE
        const VERSION = '4.2.0';
        if (localStorage.getItem('app_version') !== VERSION) {
            localStorage.clear();
            sessionStorage.clear();
            localStorage.setItem('app_version', VERSION);
        }

        function forceEmergencyReset() {
            localStorage.clear();
            sessionStorage.clear();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    for(let r of regs) r.unregister();
                    window.location.reload(true);
                });
            } else {
                window.location.reload(true);
            }
        }
    </script>

    <style>
        :root { --bg: #020617; --primary: #3b82f6; }
        body { background-color: var(--bg); margin: 0; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        #splash-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s ease;
        }
        .loader-ring {
            width: 40px; height: 40px; border: 2px solid rgba(59, 130, 246, 0.1);
            border-top: 2px solid var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #emergency-btn {
            margin-top: 40px; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
            color: #475569; cursor: pointer; display: none;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="splash-screen">
        <div class="loader-ring"></div>
        <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: #475569;">CERCLE CITOYEN</p>
        <button id="emergency-btn" onclick="forceEmergencyReset()">Réinitialiser le cache</button>
    </div>
    <script>
        // Afficher le bouton de secours après 4 secondes si ça bloque
        setTimeout(() => {
            document.getElementById('emergency-btn').style.display = 'block';
        }, 4000);
    </script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
