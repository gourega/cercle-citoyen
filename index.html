<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE V4 - SYSTÈME RÉINITIALISÉ</title>
    
    <!-- Désactivation drastique du cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* On force le noir avant même que le JS ne charge */
      body { background-color: #0a0c10 !important; margin: 0; color: white; }
      #liaison-banner, .green-banner, [class*="green"], [class*="emerald"] { 
        display: none !important; 
        opacity: 0 !important;
      }
    </style>

    <script type="module">
      // --- LE BRISE-GLACE (Context Reset) ---
      async function clearEverything() {
        console.log("Tentative de purge du contexte...");
        
        // 1. Suppression des Service Workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            console.log("Service Worker trouvé et supprimé :", registration);
            await registration.unregister();
          }
        }

        // 2. Vidage des Caches de l'API Cache
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let key of keys) {
            await caches.delete(key);
          }
        }

        // 3. Nettoyage Storage
        localStorage.clear();
        sessionStorage.clear();

        console.log("Contexte nettoyé. Lancement V4.");
      }

      // On lance le nettoyage et ensuite on importe l'app
      clearEverything().then(() => {
        import("./index.tsx?v=" + Date.now());
      });
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; flex-direction:column; gap:20px;">
            <div style="width:40px; height:40px; border:4px solid #2563eb; border-top-color:transparent; border-radius:50%; animate: spin 1s linear infinite;"></div>
            <p style="text-transform:uppercase; letter-spacing:0.2em; font-size:10px; font-weight:900;">Réinitialisation du Contexte...</p>
        </div>
    </div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
