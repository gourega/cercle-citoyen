<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN | Réseau Social</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #0a0c10; --primary: #3b82f6; }
        body { background-color: var(--bg); margin: 0; color: white; font-family: sans-serif; }
        
        #splash-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999;
        }
        .loader {
            width: 50px; height: 50px; border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Bloc d'erreur si le serveur échoue */
        #server-error {
            display: none; position: fixed; inset: 0; background: #000;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; z-index: 1000;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <div id="splash-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; color: #3b82f6; font-weight: bold; letter-spacing: 2px;">CERCLE CITOYEN</p>
    </div>

    <div id="server-error">
        <div style="border: 2px solid #ef4444; padding: 30px; border-radius: 20px; max-width: 400px; background: rgba(239, 68, 68, 0.1);">
            <h2 style="color: #ef4444; margin-bottom: 15px;">⚠️ ERREUR SERVEUR</h2>
            <p style="font-size: 14px; line-height: 1.5; color: #fca5a5;">
                Votre serveur refuse de charger les fichiers de l'application (Erreur MIME). 
                C'est ce qui cause l'écran noir.
            </p>
            <p style="margin-top: 20px; font-size: 12px; color: #9ca3af;">
                Action : Contactez votre hébergeur pour autoriser les modules JavaScript ou renommez index.tsx en index.js.
            </p>
            <button onclick="location.reload()" style="margin-top: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">Réessayer</button>
        </div>
    </div>

    <script>
        // Surveillance du chargement
        window.addEventListener('error', function(e) {
            if (e.message.includes('MIME') || e.message.includes('module')) {
                document.getElementById('server-error').style.display = 'flex';
                document.getElementById('splash-screen').style.display = 'none';
            }
        }, true);

        // Si rien ne charge après 5 secondes
        setTimeout(() => {
            if (document.getElementById('splash-screen').style.display !== 'none') {
                document.getElementById('server-error').style.display = 'flex';
                document.getElementById('splash-screen').style.display = 'none';
            }
        }, 5000);
    </script>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
