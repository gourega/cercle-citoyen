<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background-color: #0a0c10 !important; margin: 0; color: white; font-family: sans-serif; }
      #root { min-height: 100vh; background-color: #0a0c10; }
      
      /* Message de secours caché par défaut */
      #fallback-ui { 
        display: none; 
        position: fixed; 
        inset: 0; 
        z-index: 9999; 
        background: #0a0c10; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
        text-align: center;
      }
      
      #version-tag {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 8px;
        color: rgba(255,255,255,0.2);
        z-index: 9999;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root">
      <!-- Indicateur de chargement initial -->
      <div id="initial-loader" style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="font-size: 10px; letter-spacing: 0.2em; color: #4b5563; font-weight: 900; text-transform: uppercase;">Initialisation du Cercle...</p>
      </div>
    </div>

    <div id="fallback-ui">
      <h2 style="color: #ef4444; font-size: 24px; font-weight: bold; margin-bottom: 10px;">Erreur de Liaison</h2>
      <p style="color: #9ca3af; max-width: 400px; margin-bottom: 20px;">Le système n'a pas pu charger les modules souverains. Cela arrive souvent après une mise à jour du serveur.</p>
      <button onclick="location.reload(true)" style="background: #3b82f6; color: white; padding: 12px 24px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer;">Forcer le Redémarrage</button>
    </div>

    <div id="version-tag">CERCLE-V4-FIX-MIME</div>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script>
      // Système de surveillance du chargement
      window.addEventListener('error', function(e) {
        if (e.message.includes('MIME') || e.message.includes('fetch')) {
          document.getElementById('fallback-ui').style.display = 'flex';
          document.getElementById('initial-loader').style.display = 'none';
        }
      }, true);

      // Si après 5 secondes on est toujours sur le loader, on affiche l'aide
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader && loader.offsetParent !== null) {
          document.getElementById('fallback-ui').style.display = 'flex';
        }
      }, 5000);
    </script>

    <!-- Chargement relatif strict -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
