<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CERCLE CITOYEN | Penser. Relier. Agir.</title>
    
    <!-- ANTI-CACHE TOTAL AU NIVEAU HTTP -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
      /**
       * SCRIPT DE DÉCONTAMINATION ABSOLUE (Anti-Cache Zombie)
       * Ce script s'exécute AVANT le chargement de React pour nettoyer le navigateur.
       */
      (async function purgeNuclear() {
        const VERSION = 'force_update_v105'; // Incrémenté pour forcer un nouveau cycle
        
        if (localStorage.getItem('cercle_version') !== VERSION) {
          console.log('--- PURGE DU CACHE EN COURS ---');
          
          // 1. Désenregistrer tous les Service Workers
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let reg of regs) {
              await reg.unregister();
              console.log('SW unregistred');
            }
          }

          // 2. Supprimer tous les caches de fichiers
          if ('caches' in window) {
            const keys = await caches.keys();
            for (let key of keys) {
              await caches.delete(key);
              console.log('Cache deleted:', key);
            }
          }

          // 3. Nettoyer les données de stockage
          localStorage.clear();
          sessionStorage.clear();
          
          // 4. Marquer comme mis à jour et forcer le rechargement réseau
          localStorage.setItem('cercle_version', VERSION);
          console.log('Purge terminée. Rechargement...');
          window.location.reload(true);
        }
      })();
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="canonical" href="https://cerclecitoyen.ci">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://nfsskgcpqbccnwacsplc.supabase.co/storage/v1/object/public/assets/logo-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: { cercle: { blue: '#2563eb', dark: '#0f172a' } }
          }
        }
      }
    </script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; margin: 0; }
      #initial-loader {
        position: fixed; inset: 0; background: white; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .dot-pulse {
        width: 12px; height: 12px; border-radius: 50%; background-color: #2563eb;
        box-shadow: 9984px 0 0 0 #2563eb, 9999px 0 0 0 #2563eb, 10014px 0 0 0 #2563eb;
        animation: dotPulse 1.5s infinite linear;
        position: relative; left: -9999px;
      }
      @keyframes dotPulse {
        0% { box-shadow: 9984px 0 0 -5px #2563eb, 9999px 0 0 0 #2563eb, 10014px 0 0 2px #2563eb; }
        50% { box-shadow: 9984px 0 0 2px #2563eb, 9999px 0 0 -5px #2563eb, 10014px 0 0 0 #2563eb; }
        100% { box-shadow: 9984px 0 0 -5px #2563eb, 9999px 0 0 0 #2563eb, 10014px 0 0 2px #2563eb; }
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

  }
}
</script>
</head>
<body>
    <div id="initial-loader">
        <div class="dot-pulse"></div>
        <p style="margin-top: 40px; font-weight: 700; font-size: 10px; letter-spacing: 0.3em; color: #94a3b8; text-transform: uppercase;">Mise à jour du Portail Officiel...</p>
    </div>

    <div id="root"></div>

    <script type="module" src="./index.tsx?v=1.0.5"></script>
    
    <script>
      // Enregistrement ultra-léger du SW avec cache-busting
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js?v=' + Date.now(), { scope: './' });
        });
      }

      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }, 800);
      });
    </script>
</body>
