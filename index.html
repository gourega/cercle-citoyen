<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE | MAINTENANCE SYSTÈME</title>
    
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 80%;
            border: 1px solid #0f0;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        p { font-size: 0.9rem; color: #888; margin-bottom: 30px; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
        }
        button:hover { background: #fff; }
        .status { margin-top: 20px; font-size: 0.7rem; color: #444; }
    </style>

    <script>
        async function nuclearReset() {
            const btn = document.querySelector('button');
            btn.innerHTML = "NETTOYAGE EN COURS...";
            btn.disabled = true;

            try {
                // 1. Désenregistrement des Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('SW Unregistered');
                    }
                }

                // 2. Vidage des Caches API
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                        console.log('Cache Deleted:', name);
                    }
                }

                // 3. Vidage des données locales
                localStorage.clear();
                sessionStorage.clear();

                // 4. Forçage du rechargement avec bypass du cache navigateur
                document.body.innerHTML = "<div class='container'><h1>RÉINITIALISATION RÉUSSIE</h1><p>Redirection vers le nouveau portail...</p></div>";
                
                setTimeout(() => {
                    // On ajoute un paramètre aléatoire pour forcer le serveur à envoyer un nouveau fichier
                    window.location.href = window.location.pathname + '?refresh=' + Date.now();
                }, 2000);

            } catch (e) {
                alert("Erreur lors de la purge. Essayez de vider manuellement votre historique.");
            }
        }

        // Si l'utilisateur a déjà réinitialisé (détecté par le paramètre refresh)
        // on lance directement l'app après 1 seconde
        window.onload = () => {
            if (window.location.search.includes('refresh=')) {
                document.body.innerHTML = `
                    <div class="container">
                        <h1 style="color: #2563eb; border-color: #2563eb;">CHARGEMENT DU CERCLE</h1>
                        <p>Connexion à l'infrastructure souveraine v3.0.0...</p>
                        <div style="width: 40px; height: 40px; border: 4px solid #2563eb; border-top-color: transparent; border-radius: 50%; animate: spin 1s linear infinite; margin: 0 auto;"></div>
                    </div>
                    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                `;
                
                // Injection dynamique du script React pour éviter le cache de l'index.html
                const script = document.createElement('script');
                script.type = 'module';
                script.src = './index.tsx?v=' + Date.now();
                document.head.appendChild(script);

                const root = document.createElement('div');
                root.id = 'root';
                document.body.appendChild(root);
            }
        };
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div class="container">
        <h1>[ CERCLE CITOYEN ]</h1>
        <p>Une ancienne version est détectée dans votre navigateur.<br>Pour accéder au nouveau réseau social, une purge est nécessaire.</p>
        <button onclick="nuclearReset()">Forcer la mise à jour</button>
        <div class="status">Souveraineté Numérique • Version 3.0.0-RESET</div>
    </div>
</body>
</html>
