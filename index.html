<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN - SOUVERAINETÉ</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Styles critiques pour enterrer définitivement le "Zombie" vert */
      body { background-color: #0a0c10 !important; margin: 0; color: white; font-family: sans-serif; }
      #root { min-height: 100vh; background-color: #0a0c10; }
      
      /* On force la disparition de tout ce qui appartient à l'ancienne version (Liaison Souveraine) */
      #liaison-banner, .green-banner, .bg-green-600, #zombie-overlay, [class*="green-"], [class*="emerald-"] { 
        display: none !important; 
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #version-tag {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 8px;
        color: rgba(255,255,255,0.2);
        z-index: 9999;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="version-tag">CERCLE-V4-SOUVERAINETÉ-ACTIVE</div>

    <script>
      // Protocole de nettoyage immédiat des anciens Service Workers qui maintiennent le cache zombie
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function() {
              console.log('Système : Ancien Service Worker démantelé.');
            });
          }
        });
      }
      
      // Vidage forcé des caches du navigateur pour garantir le chargement des nouveaux modules
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
    </script>

    <!-- Entrée principale déclarée de façon statique pour permettre la transpilation correcte par l'environnement -->
    <script type="module" src="index.tsx"></script>
</body>
</html>
