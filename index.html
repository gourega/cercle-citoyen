<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CERCLE CITOYEN | Souveraineté Numérique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // SCRIPT DE RÉINITIALISATION D'URGENCE (CRITIQUE)
        window.forceClean = function(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            console.log("Tentative de réinitialisation...");
            
            try {
                // Nettoyage complet
                localStorage.clear();
                sessionStorage.clear();
                
                // Nettoyage des cookies
                var cookies = document.cookie.split(";");
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i];
                    var eqPos = cookie.indexOf("=");
                    var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                }

                // Feedback visuel immédiat
                document.body.style.opacity = '0.5';
                
                // Rechargement forcé avec paramètre anti-cache
                var cleanUrl = window.location.origin + window.location.pathname + '?reset=' + Date.now();
                window.location.replace(cleanUrl);
            } catch (e) {
                alert("Erreur critique. Merci de vider manuellement le cache de votre navigateur.");
            }
            return false;
        };
    </script>

    <style>
        :root { --bg: #020617; --primary: #3b82f6; }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none !important; 
            -webkit-user-select: none !important;
        }
        
        input, textarea { 
            user-select: text !important; 
            -webkit-user-select: text !important; 
        }

        body { 
            background-color: var(--bg); 
            margin: 0; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            touch-action: pan-y; /* Permet le scroll vertical mais bloque les gestes complexes */
        }

        #splash-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9000;
        }

        .loader-ring {
            width: 40px; height: 40px; border: 2px solid rgba(59, 130, 246, 0.1);
            border-top: 2px solid var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ZONE BOUTON D'URGENCE */
        #emergency-trigger {
            position: fixed; 
            bottom: 50px; 
            left: 0; 
            right: 0; 
            text-align: center;
            z-index: 10000; /* Priorité absolue sur le splash screen */
            padding: 20px;
        }

        .btn-reset {
            background: #1e293b;
            border: 2px solid #3b82f6;
            color: #ffffff !important;
            padding: 20px 40px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            pointer-events: auto !important;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: inline-block;
            text-decoration: none;
            -webkit-appearance: none;
        }

        .btn-reset:active {
            transform: scale(0.92);
            background: #3b82f6;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <div id="splash-screen">
        <div class="loader-ring"></div>
        <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: #475569;">CERCLE CITOYEN</p>
    </div>

    <!-- Le bouton utilise ontouchstart pour bypasser Chrome Mobile "Touch to Search" -->
    <div id="emergency-trigger">
        <button 
            type="button" 
            class="btn-reset" 
            ontouchstart="window.forceClean(event)" 
            onmousedown="window.forceClean(event)"
            onclick="window.forceClean(event)"
        >
            Réinitialiser l'application
        </button>
    </div>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
