<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN - SOUVERAINETÉ</title>
    
    <!-- Contrôle strict du cache pour éviter le retour du "Zombie" -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Thème de base immédiat pour éviter le flash blanc */
      body { background-color: #0a0c10 !important; margin: 0; color: white; font-family: sans-serif; overflow-x: hidden; }
      #root { min-height: 100vh; background-color: #0a0c10; }
      
      /* Masquage forcé des résidus visuels de l'ancienne version */
      #liaison-banner, .green-banner, .bg-green-600, #zombie-overlay { 
        display: none !important; 
        visibility: hidden !important;
        opacity: 0 !important;
      }

      #version-tag {
        position: fixed;
        bottom: 10px;
        right: 10px;
        font-size: 8px;
        color: rgba(255,255,255,0.2);
        z-index: 9999;
        pointer-events: none;
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div id="version-tag">CERCLE-V4-SOUVERAINETÉ-ACTIVE</div>

    <script>
      // Purge des anciens Service Workers en arrière-plan
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for(let r of regs) r.unregister();
        });
      }
      // Vidage des caches API
      if ('caches' in window) {
        caches.keys().then(keys => {
          for(let k of keys) caches.delete(k);
        });
      }
    </script>

    <!-- Point d'entrée unique de l'application -->
    <script type="module" src="index.tsx"></script>
</body>
</html>
