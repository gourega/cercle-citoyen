    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: { cercle: { blue: '#2563eb' } }
          }
        }
      }
    </script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; margin: 0; }
      .font-serif { font-family: 'Playfair Display', serif; }
      .page-transition { animation: fadeIn 0.6s ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      
      #critical-error {
        display: none;
        position: fixed;
        inset: 0;
        background: white;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
    </style>

    <script>
      // 1. Force HTTPS
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        location.replace(`https:${location.href.substring(location.protocol.length)}`);
      }

      window.process = { env: { NODE_ENV: 'production' } };
      
      // 2. Détection d'erreur critique de chargement (522/Réseau)
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          document.getElementById('critical-error').style.display = 'flex';
        }
      }, true);
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root"></div>
    
    <!-- Écran de secours en cas d'erreur 522 persistante -->
    <div id="critical-error">
        <div style="background: #fee2e2; color: #991b1b; padding: 2rem; border-radius: 2rem; max-width: 400px; border: 1px solid #fecaca;">
            <h2 style="font-family: serif; margin-bottom: 1rem;">Connexion instable</h2>
            <p style="font-size: 14px; line-height: 1.6;">Le serveur Cloudflare ne parvient pas à établir la liaison. Cela arrive souvent lors d'une mise à jour des certificats SSL ou d'un mode "Flexible" erroné.</p>
            <button onclick="location.reload()" style="margin-top: 1.5rem; background: #991b1b; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 1rem; cursor: pointer; font-weight: bold;">Réessayer</button>
        </div>
    </div>

    <script type="module" src="index.tsx"></script>
</body>
</html>
