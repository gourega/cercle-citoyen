<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CERCLE CITOYEN | Réseau Social Souverain</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #0a0c10; --primary: #3b82f6; }
        body { 
            background-color: var(--bg); 
            margin: 0; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-serif { font-family: 'Playfair Display', serif; }
        
        #splash-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999;
        }
        .loader-ring {
            width: 60px; height: 60px; border: 3px solid rgba(59, 130, 246, 0.1);
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #server-error {
            display: none; position: fixed; inset: 0; background: #000;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center; z-index: 1000;
        }

        /* Scrollbar élégante */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.5); }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.462.0?deps=react@19.0.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.0?deps=react@19.0.0,react-dom@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <div id="splash-screen">
        <div class="loader-ring"></div>
        <div style="margin-top: 30px; text-align: center;">
            <h1 style="font-size: 14px; letter-spacing: 0.6em; font-weight: 900; color: var(--primary); text-transform: uppercase;">Cercle Citoyen</h1>
            <p style="font-size: 10px; color: #4b5563; margin-top: 10px; font-weight: bold;">SOUVERAINETÉ NUMÉRIQUE IVOIRIENNE</p>
        </div>
    </div>

    <div id="server-error">
        <div style="border: 2px solid #ef4444; padding: 40px; border-radius: 40px; max-width: 400px; background: rgba(239, 68, 68, 0.05); backdrop-blur-xl;">
            <h2 style="color: #ef4444; font-size: 24px; font-weight: bold; margin-bottom: 20px;">ERREUR SERVEUR</h2>
            <p style="color: #9ca3af; font-size: 14px; line-height: 1.6;">Le serveur refuse de charger les modules. Contactez votre hébergeur pour autoriser les fichiers .tsx ou transformez-les en .js.</p>
            <button onclick="location.reload()" style="margin-top: 30px; background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%;">Réessayer</button>
        </div>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('MIME') || e.message.includes('module'))) {
                document.getElementById('server-error').style.display = 'flex';
                document.getElementById('splash-screen').style.display = 'none';
            }
        }, true);
        setTimeout(() => {
            if (document.getElementById('splash-screen').style.display !== 'none') {
                document.getElementById('server-error').style.display = 'flex';
                document.getElementById('splash-screen').style.display = 'none';
            }
        }, 10000);
    </script>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
